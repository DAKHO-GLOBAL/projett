# Configuration for the Reinforcement Learning models

# PPO agent configuration
ppo:
  # Network architecture
  policy_network:
    type: "MlpPolicy"
    net_arch: [64, 64]
    activation_fn: "tanh"
  
  # Training hyperparameters
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  
  # Training process
  total_timesteps: 1000000
  save_freq: 10000
  log_interval: 1
  eval_freq: 10000
  n_eval_episodes: 10
  tb_log_name: "PPO"

# SAC agent configuration
sac:
  policy_network:
    type: "MlpPolicy"
    net_arch: [256, 256]
  
  learning_rate: 3.0e-4
  buffer_size: 1000000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  learning_starts: 10000
  ent_coef: "auto"