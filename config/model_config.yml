# Configuration for the Reinforcement Learning models


# PPO agent configuration
ppo:
  # Network architecture
  policy_network:
    type: "MlpPolicy"
    net_arch: [64, 32]  # Réduit à une architecture plus simple
    activation_fn: "relu"  # Changé de tanh à relu pour de meilleures performances
  
  # Training hyperparameters
  learning_rate: 5.0e-5  # Réduit pour une convergence plus stable
  n_steps: 2048
  batch_size: 32
  n_epochs: 8  # Légèrement réduit pour éviter le surapprentissage
  gamma: 0.985
  gae_lambda: 0.95
  clip_range: 0.15
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.01  # Légèrement augmenté pour favoriser l'exploration
  vf_coef: 0.5
  max_grad_norm: 0.5
  
  # Training process
  total_timesteps: 600000
  save_freq: 10000
  log_interval: 1
  eval_freq: 10000
  n_eval_episodes: 10
  tb_log_name: "PPO"
  
  # Paramètres spécifiques à l'or
  gold_trading:
    min_position_size: 0.01  # Force au moins un micro lot
    action_bias: true  # Active le biais vers la prise de position
    dropout_rate: 0.15  # Ajoute du dropout pour la régularisation
    early_stopping_patience: 5  # Arrêt anticipé après 5 évaluations sans amélioration

# SAC agent configuration
sac:
  policy_network:
    type: "MlpPolicy"
    net_arch: [256, 256]
  
  learning_rate: 3.0e-4
  buffer_size: 1000000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  learning_starts: 10000
  ent_coef: "auto"